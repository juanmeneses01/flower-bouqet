
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A bouquet for you</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 42%,#293449 0%,#1d2432 58%,#151b27 100%);color:#f8f4fa;display:grid;place-items:center;font-family:monospace;overflow:hidden}
main{width:min(100vw,1000px);padding:16px 10px 24px;text-align:center}
#stage{width:100%;height:min(84vh,820px);min-height:430px;display:grid;place-items:center;overflow:hidden}
pre{margin:0;white-space:pre;line-height:1.08;font-size:clamp(5px,1.12vw,10px);font-weight:700;letter-spacing:0;text-align:left}
#message{margin-top:4px;color:#ff79ae;font-size:14px;letter-spacing:.04em;text-shadow:0 0 12px #ff4c98}
small{display:block;margin-top:9px;color:#788093;font:11px monospace}
</style>
</head>
<body>
<main>
<div id="stage"><pre id="art"></pre></div>
<div id="message">for you ♥</div>
<small>made with a little love</small>
</main>
<script>
(() => {
const COLS=104, ROWS=49, FPS=24, SPIN=.6, TILT=.30, CAM=4, PIVOT=.2;
const WHITE=[244,248,251,254,255,231], PINK=[125,162,168,205,211,218,225],
RED=[52,88,124,160,196,203], PURPLE=[54,91,97,134,140,183],
YELLOW=[136,178,214,220,226,229], ORANGE=[130,166,202,208,214,216],
GOLD=[94,136,178,214,220], DARK=[52,58,94,130,136],
GREEN=[22,28,28,34,35,71,77,114], PAPER=[101,144,187,223,230,231],
RIBBON=[88,125,161,197,204,211], HEART=[161,197,204,205,211,218];
const SHADE=".:-=+*%@".split(""), PETAL="+*#%".split("");
const rgb256=n=>{
if(n<16)return ["#000000","#800000","#008000","#808000","#000080","#800080","#008080","#c0c0c0","#808080","#ff0000","#00ff00","#ffff00","#0000ff","#ff00ff","#00ffff","#ffffff"][n];
if(n>=232){let v=8+(n-232)*10;return `rgb(${v},${v},${v})`}
let q=n-16,r=Math.floor(q/36),g=Math.floor(q%36/6),b=q%6;
const v=x=>x===0?0:55+x*40;
return `rgb(${v(r)},${v(g)},${v(b)})`;
};
const norm=v=>{let m=Math.hypot(...v)||1;return v.map(x=>x/m)};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const add=(p,d,k)=>p.map((x,i)=>x+d[i]*k);
let seed=21;
const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const pts=[],flowers=[],babies=[],sparkles=[];

function build(){
const neck=[0,-.12,0],C=[0,.12,0],D=.64,golden=Math.PI*(3-Math.sqrt(5)),heads=[];
for(let i=0;i<10;i++){
let el=(88-60*Math.sqrt(i/9))*Math.PI/180,az=i*golden;
let d=[Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)];
let p=add(C,d,D*(.92+rand()*.13));heads.push([p,norm(d)]);
}
const tulips=new Set([3,8]);let di=0;
const disc=[[WHITE,GOLD,13],[PINK,GOLD,8],[RED,DARK,6],[PURPLE,GOLD,7],[YELLOW,DARK,12],[ORANGE,DARK,9]];
heads.forEach(([pos,axis],idx)=>{
let base=add(pos,axis,-.03);
for(let j=0;j<70;j++){
let t=j/69,p=base.map((v,k)=>v+(neck[k]-v)*t);
pts.push([...p,axis[0],0,axis[2],GREEN,-.15,true,null]);
}
if(tulips.has(idx)){
let n=[...tulips].filter(k=>k<idx).length;
flowers.push([pos,"tulip",[RED,PINK,YELLOW][n%3],null,0,.11,rand()*6.28]);
}else{
let [pet,cen,np]=disc[di++%disc.length];
flowers.push([pos,"disc",pet,cen,np,.12+rand()*.02,rand()*6.28]);
}
});
for(let i=0;i<8;i++){
let a=(i+.4)/8*2*Math.PI,c=Math.cos(a),s=Math.sin(a),base=[.26*c,.30,.26*s];
let d=norm([c,.15,s]),side=[-s,0,c],n=norm(cross(side,d)),L=.30,W=.07;
for(let ti=0;ti<32;ti++){
let t=ti/31;
for(let wi=-5;wi<=5;wi++){
let w=wi/5,curl=.025*w*w;
let p=[base[0]+d[0]*L*t+side[0]*W*Math.sin(Math.PI*t)*w+n[0]*curl,
base[1]+d[1]*L*t-.10*t*t+n[1]*curl,
base[2]+d[2]*L*t+side[2]*W*Math.sin(Math.PI*t)*w+n[2]*curl];
pts.push([...p,n[0],n[1],n[2],GREEN,wi===0?-.25:0,true,null]);
}
}
}
let y0=-.20,y1=.30,r0=.06,r1=.36,k=(r1-r0)/(y1-y0);
for(let i=0;i<50;i++){
let t=i/49,r=r0+(r1-r0)*t,count=Math.max(8,Math.floor(170*r));
for(let j=0;j<count;j++){
let ph=(j+rand())/count*2*Math.PI,c=Math.cos(ph),s=Math.sin(ph),y=y0+(y1-y0)*t;
if(t>.9)y+=.03*Math.sin(9*ph);
let fold=.3*(Math.abs(Math.sin(5*ph))-.6),nn=norm([c,-k,s]);
pts.push([r*c,y,r*s,...nn,PAPER,fold,false,null]);
}
}
for(let i=0;i<7;i++){
let a=i/7*2*Math.PI,sx=.025*Math.cos(a),sz=.025*Math.sin(a);
for(let j=0;j<40;j++){
let t=j/39;
pts.push([sx*(1+1.2*t),-.20-.30*t,sz*(1+1.2*t),Math.cos(a),0,Math.sin(a),GREEN,-.1,true,null]);
}
}
let by=-.12,br=r0+k*(by-y0)+.01;
for(let j=0;j<90;j++){
let ph=j/90*2*Math.PI;
for(let dy of [-.012,0,.012])pts.push([br*Math.cos(ph),by+dy,br*Math.sin(ph),Math.cos(ph),0,Math.sin(ph),RIBBON,0,false,null]);
}
let knot=[0,by,br+.01];
for(let side of [-1,1]){
for(let j=0;j<70;j++){
let a=j/70*2*Math.PI,lx=side*(.07+.07*Math.cos(a)),ly=.04*Math.sin(a)+.02*(.07+.07*Math.cos(a))/.14;
for(let fill of [1,.7])pts.push([knot[0]+lx*fill,knot[1]+ly*fill,knot[2]+.01,side*.3,.2,.93,RIBBON,.1,true,null]);
}
for(let j=0;j<30;j++){
let t=j/29;
pts.push([knot[0]+side*.06*t,knot[1]-.15*t,knot[2]+.015,side*.2,0,.98,RIBBON,-.05+.05*Math.sin(t*9),true,null]);
}
}
for(let dx of [-.01,0,.01])pts.push([dx,by,knot[2]+.02,0,0,1,RIBBON,.2,true,"@"]);
for(let i=0;i<90;i++){
let a=rand()*2*Math.PI,el=.3+rand()*1.1,rr=.4+rand()*.18;
babies.push([rr*Math.cos(a)*Math.cos(el),C[1]+rr*Math.sin(el),rr*Math.sin(a)*Math.cos(el),rand()*6.28]);
}
for(let i=0;i<30;i++){
let a=rand()*2*Math.PI,rr=.75+rand()*.2;
sparkles.push([rr*Math.cos(a),-.3+rand()*1.3,rr*Math.sin(a),rand()*6.28,1.5+rand()*2.5]);
}
}
build();
let hearts=Array.from({length:18},()=>[rand(),rand(),.03+rand()*.05,rand()*6.28,HEART[Math.floor(rand()*HEART.length)]]);
const art=document.getElementById("art");

function render(t){
const chars=Array.from({length:ROWS},()=>Array(COLS).fill(" "));
const colors=Array.from({length:ROWS},()=>Array(COLS).fill(0));
const zbuf=Array.from({length:ROWS},()=>Array(COLS).fill(-1e9));
const vr=ROWS-2,scale=Math.max(1,Math.min((vr-2)/1.45,(COLS-2)/2.7));
const sx=scale*2,cx=COLS/2,cy=1+.78*scale;
const ang=t*SPIN,ca=Math.cos(ang),sa=Math.sin(ang),ct=Math.cos(TILT),st=Math.sin(TILT),L=norm([-.45,.6,.66]);

function proj(x,y,z){
let xr=x*ca-z*sa,zr=x*sa+z*ca,yp=y-PIVOT;
let yt=yp*ct-zr*st,zt=yp*st+zr*ct,f=CAM/(CAM-zt);
return [cx+xr*f*sx,cy-yt*f*scale,zt,f];
}
function plot(c,r,z,ch,col){
c=Math.floor(c);r=Math.floor(r);
if(r>=0&&r<vr&&c>=0&&c<COLS&&z>zbuf[r][c]){
zbuf[r][c]=z;chars[r][c]=ch;colors[r][c]=col;
}
}
hearts.forEach(h=>plot((h[0]+.015*Math.sin(t*1.2+h[3]))*COLS,h[1]*vr,-50,"♥",h[4]));
pts.forEach(p=>{
let [x,y,z,nx,ny,nz,pal,tone,two,over]=p;
let [c,r,zt]=proj(x,y,z);
let nxr=nx*ca-nz*sa,nzr=nx*sa+nz*ca,nyt=ny*ct-nzr*st,nzt=ny*st+nzr*ct;
let dot=nxr*L[0]+nyt*L[1]+nzt*L[2];
if(two&&dot<0)dot=-dot*.55;
let b=Math.max(0,Math.min(.999,.25+.75*Math.max(0,dot)+tone));
let ch=over||SHADE[Math.floor(b*SHADE.length)];
plot(c,r,zt,ch,pal[Math.floor(b*pal.length)]);
});
flowers.forEach(([pos,kind,pal,cpal,np,R,seed])=>{
let [fx,fy,zt,f]=proj(...pos),rx=R*f*sx,ry=R*f*scale;
let dim=-.4*(1-Math.max(0,Math.min(1,(zt+.6)/1.2))),rot=seed+ang*.7;
for(let r=Math.floor(fy-ry)-1;r<fy+ry+2;r++){
let dy=(r+.5-fy)/ry;
for(let c=Math.floor(fx-rx)-1;c<fx+rx+2;c++){
let dx=(c+.5-fx)/rx,b;
if(kind==="disc"){
let s=Math.hypot(dx,dy);
if(s>1)continue;
if(s<.3){
b=Math.max(0,Math.min(.999,.55-.35*dx-.35*dy+dim));
plot(c,r,zt+.06,s<.17?"@":"o",cpal[Math.floor(b*cpal.length)]);
continue;
}
let ph=Math.atan2(dy,dx),reach=.32+.68*Math.pow(Math.abs(Math.cos(np*(ph+rot)/2)),.7);
if(s>reach)continue;
let edge=s>reach-.14?-.22:0;
b=Math.max(0,Math.min(.999,.62-.22*dx-.28*dy+.12*s+edge+dim));
plot(c,r,zt+.04*(1-s),PETAL[Math.floor(b*PETAL.length)],pal[Math.floor(b*pal.length)]);
}else{
let v=(1-dy)/2;
if(v<0||v>1)continue;
let hw=.62*Math.sin(Math.PI*.5*Math.min(1,v*1.5+.05));
if(hw<=0||Math.abs(dx)>hw)continue;
let xn=dx/hw;
if(v>.72+.28*Math.pow(Math.cos(1.5*Math.PI*xn),2))continue;
let seam=Math.abs(Math.abs(xn)-.33)<.12&&v>.3?-.25:0;
b=Math.max(0,Math.min(.999,.55-.3*xn+.1*v+seam+dim));
plot(c,r,zt+.03,PETAL[Math.floor(b*PETAL.length)],pal[Math.floor(b*pal.length)]);
}
}
}
});
babies.forEach(([x,y,z,ph])=>{
let [c,r,zt]=proj(x,y,z);
plot(c,r,zt+.02,Math.sin(t*2+ph)>.6?"*":"·",255);
});
sparkles.forEach(([x,y,z,ph,sp])=>{
let [c,r,zt]=proj(x,y,z),tw=Math.sin(t*sp+ph);
if(tw>.85)plot(c,r,zt,"*",231);
else if(tw>.4)plot(c,r,zt,"+",225);
else if(tw>0)plot(c,r,zt,"·",218);
});
const msg="for you ♥",mr=ROWS-2,stx=Math.floor((COLS-msg.length)/2),shift=Math.floor(t*6);
[...msg].forEach((ch,i)=>{
chars[mr][stx+i]=ch;
colors[mr][stx+i]=[161,168,205,211,218,225,218,211,205,168][(i+shift)%10];
});
art.innerHTML=chars.map((line,r)=>{
let out="",last=-1;
line.forEach((ch,c)=>{
let col=colors[r][c];
if(ch!==" "&&col!==last){out+=`<span style="color:${rgb256(col)}">`;last=col;}
out+=ch;
});
return out+"</span>";
}).join("\n");
}
let start=performance.now(),last=0;
function frame(now){
if(now-last>1000/FPS){render((now-start)/1000);last=now;}
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
